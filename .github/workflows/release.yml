name: Release hpke

permissions: {}

on:
  push:
    tags: ['v1.[0-9]+.[0-9]+']

jobs:
  release:
    permissions:
      actions: read
      contents: write
      discussions: write
      id-token: write
    uses: panva/.github/.github/workflows/npm-release.yml@main
    with:
      artifact_check_command: node tools/test-dist.js "$PACKAGE_TARBALL" .
      cleanup_paths: '["index.js","index.d.ts","index.d.ts.map"]'
      prepare_command: npm clean-install && node --run build && git diff --exit-code

  deploy:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml
