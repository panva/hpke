name: Release @panva/hpke-noble

permissions: {}

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      discussions: write
      id-token: write
    uses: panva/.github/.github/workflows/npm-release.yml@75ad63f5730195dd3e9ec22dbbf29101c99d8501 # v4
    with:
      github_release: false
      maintenance_branch: false
      manifest_directory: ./examples/noble-suite
      package_directory: ./examples/noble-suite
      artifact_check_command: node tools/test-dist.js "$PACKAGE_TARBALL" examples/noble-suite
      prepare_command: npm clean-install && node --run build
      tagged_release: false
